# Serves the built SPA and reverse-proxies API + SSE calls to the
# backend service on the compose network, so the browser only ever
# talks to this one origin. "backend" below is the service name in
# docker-compose.yml, resolved via Docker's embedded DNS.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router v7 client-side routing: unknown paths fall back to
    # index.html rather than 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets are content-hashed by Vite; cache them hard.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # All backend API calls, including the SSE stream at
    # /api/v1/agents/stream. proxy_buffering is off so streamed
    # chunks reach the browser as they arrive instead of being
    # queued until nginx's buffer fills.
    location /api/v1/ {
        proxy_pass http://backend:8000/api/v1/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }
}
